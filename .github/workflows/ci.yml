name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The audit reads its frozen prompts from its repository, so it is installed as
      # an editable checkout of the tag, not as a wheel.
      - name: Install the audit at audit-final
        run: |
          git clone --depth 1 --branch audit-final https://github.com/Arshia-HZ/mas-channel-audit.git "$RUNNER_TEMP/mas-channel-audit"
          python -m pip install -e "$RUNNER_TEMP/mas-channel-audit"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
